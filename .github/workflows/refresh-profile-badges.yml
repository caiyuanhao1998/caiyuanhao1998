name: Refresh profile badges

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-profile-badges
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch valid badge snapshots
        run: python3 scripts/refresh_badges.py
      - name: Publish changed badges
        run: |
          git add -- assets/google-scholar-citations.svg assets/github-stars.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile badges'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
