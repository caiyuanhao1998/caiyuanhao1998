<svg xmlns="http://www.w3.org/2000/svg" width="201" height="20" role="img" aria-label="🤗 Hugging Face: 110k downloads">
  <title>🤗 Hugging Face: 110k downloads</title>
  <filter id="blur">
    <feGaussianBlur stdDeviation="16" />
  </filter>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1" />
    <stop offset="1" stop-opacity=".1" />
  </linearGradient>
  <clipPath id="r">
    <rect width="201" height="20" rx="3" />
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="102" height="20" fill="#555" />
    <rect x="102" width="99" height="20" fill="#e5c239" />
    <rect width="102" height="20" fill="url(#s)" />
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <image x="5" y="3" width="14" height="14" href="data:image/png;base64," />
    <g transform="scale(.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="605" y="150" fill-opacity=".8" filter="url(#blur)" textLength="750">Hugging Face</text>
        <text x="605" y="150" fill-opacity=".3" textLength="750">Hugging Face</text>
      </g>
      <text x="605" y="140" textLength="750">Hugging Face</text>
    </g>
    <g transform="scale(.1)">
      <g aria-hidden="true" fill="#010101">
        <text x="1505" y="150" fill-opacity=".8" filter="url(#blur)" textLength="890">110k downloads</text>
        <text x="1505" y="150" fill-opacity=".3" textLength="890">110k downloads</text>
      </g>
      <text x="1505" y="140" textLength="890" fill="#fff">110k downloads</text>
    </g>
  </g>
</svg>
